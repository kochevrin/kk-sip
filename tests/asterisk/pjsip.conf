[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5070

[ep](!)
type=endpoint
context=internal
disallow=all
allow=opus,g722,alaw,ulaw
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes

[auth](!)
type=auth
auth_type=userpass
password=secret

[aor](!)
type=aor
max_contacts=2
remove_existing=yes

[101](ep)
auth=101
aors=101
callerid="User 101" <101>
[101](auth)
username=101
[101](aor)

[102](ep)
auth=102
aors=102
callerid="User 102" <102>
[102](auth)
username=102
[102](aor)

[103](ep)
auth=103
aors=103
callerid="User 103" <103>
[103](auth)
username=103
[103](aor)
